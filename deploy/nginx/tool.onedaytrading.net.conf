limit_req_zone $binary_remote_addr zone=onedaytools_limit:10m rate=30r/s;

upstream onedaytools_app {
    server 127.0.0.1:3200;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tool.onedaytrading.net;

    client_max_body_size 2m;

    access_log /var/log/nginx/onedaytools.access.log;
    error_log /var/log/nginx/onedaytools.error.log warn;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /_next/static/ {
        proxy_pass http://onedaytools_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=onedaytools_limit burst=60 nodelay;
        proxy_pass http://onedaytools_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
